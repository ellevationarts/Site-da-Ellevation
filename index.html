      @keyframes shine {
        0% { transform: translateX(-200%) skewX(-30deg); }
        100% { transform: translateX(200%) skewX(-30deg); }
      }

      .shiny-effect {
        position: relative;
        overflow: hidden;
      }

      .shiny-effect::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        animation: shine 4s infinite linear;
      }
    </style>
